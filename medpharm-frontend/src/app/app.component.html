<header>
  <h1>MedPharm Express</h1>
  @if (auth.sesion()) {
    <nav>
      <a routerLink="/recetas">Recetas</a>
      @if (auth.sesion()?.rol === 'MEDICO') { <a routerLink="/nueva-receta">Nueva receta</a> }
      <span>{{ auth.sesion()?.username }}</span>
      <button type="button" (click)="salir()">Salir</button>
    </nav>
  }
</header>
<main><router-outlet /></main>
